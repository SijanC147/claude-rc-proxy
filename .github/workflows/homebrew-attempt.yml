name: Homebrew publication attempt

on:
  workflow_call:
    inputs:
      attempt:
        required: true
        type: number
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      arm64_sha:
        required: true
        type: string
      amd64_sha:
        required: true
        type: string
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true
    outputs:
      pushed:
        description: Whether this attempt published or was already current
        value: ${{ jobs.publish.outputs.pushed }}

permissions:
  contents: read

jobs:
  validate:
    name: Prepare and validate tap proposal
    runs-on: macos-14
    outputs:
      artifact: ${{ steps.proposal.outputs.artifact }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          token: ${{ github.token }}

      - name: Load private tap credential from 1Password
        id: tap_secret
        uses: 1Password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GH_PAT: op://CICD/GH_PAT/credential

      - name: Clone private tap as bare Git data only
        env:
          GH_TOKEN: ${{ steps.tap_secret.outputs.GH_PAT }}
        run: |
          gh auth setup-git
          gh repo clone https://github.com/SijanC147/homebrew-hextap.git \
            "$RUNNER_TEMP/homebrew-hextap.git" -- --bare --depth=1 --branch main

      - name: Build immutable public proposal
        id: proposal
        env:
          AMD64_SHA: ${{ inputs.amd64_sha }}
          ARM64_SHA: ${{ inputs.arm64_sha }}
          ATTEMPT: ${{ inputs.attempt }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          proposal="$RUNNER_TEMP/proposal"
          tap="$RUNNER_TEMP/homebrew-hextap"
          tap_git="$RUNNER_TEMP/homebrew-hextap.git"
          mkdir -p "$proposal" "$tap"
          git --git-dir="$tap_git" archive --format=tar.gz --output="$RUNNER_TEMP/tap.tar.gz" HEAD
          tar -xzf "$RUNNER_TEMP/tap.tar.gz" -C "$tap"
          if [[ -f "$tap/Formula/claude-rc-proxy.rb" ]]; then
            cp "$tap/Formula/claude-rc-proxy.rb" "$proposal/claude-rc-proxy.rb"
          fi
          ruby scripts/update-homebrew-formula.rb \
            --formula "$proposal/claude-rc-proxy.rb" \
            --template packaging/homebrew/claude-rc-proxy.rb.tmpl \
            --version "$RELEASE_VERSION" \
            --arm64-sha "$ARM64_SHA" \
            --amd64-sha "$AMD64_SHA"
          git --git-dir="$tap_git" rev-parse HEAD > "$proposal/base-sha"
          shasum -a 256 "$proposal/claude-rc-proxy.rb" | awk '{ print $1 }' > "$proposal/formula-sha256"
          cp "$proposal/claude-rc-proxy.rb" "$tap/Formula/claude-rc-proxy.rb"
          artifact="homebrew-proposal-${GITHUB_RUN_ID}-${ATTEMPT}"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload immutable proposal before tap execution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.proposal.outputs.artifact }}
          path: |
            ${{ runner.temp }}/proposal/base-sha
            ${{ runner.temp }}/proposal/claude-rc-proxy.rb
            ${{ runner.temp }}/proposal/formula-sha256
          if-no-files-found: error
          retention-days: 1

      - name: Validate Formula, service, and entire tap without credentials
        run: scripts/validate-homebrew-tap.sh "$RUNNER_TEMP/homebrew-hextap" sijanc147/hextap

  publish:
    name: Atomically publish validated Formula
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.publish.outputs.pushed }}
    concurrency:
      group: homebrew-hextap-publish
      queue: max
      cancel-in-progress: false
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Download validated immutable proposal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate.outputs.artifact }}
          path: ${{ runner.temp }}/proposal

      - name: Verify proposal before loading credential
        run: |
          proposal="$RUNNER_TEMP/proposal"
          expected_sha="$(cat "$proposal/formula-sha256")"
          actual_sha="$(shasum -a 256 "$proposal/claude-rc-proxy.rb" | awk '{ print $1 }')"
          [[ "$actual_sha" == "$expected_sha" ]]
          grep -Eq '^[0-9a-f]{40}$' "$proposal/base-sha"

      - name: Load private tap credential from 1Password
        id: tap_secret
        uses: 1Password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GH_PAT: op://CICD/GH_PAT/credential

      - name: Compare-and-swap one validated Formula file
        id: publish
        env:
          GH_TOKEN: ${{ steps.tap_secret.outputs.GH_PAT }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          proposal="$RUNNER_TEMP/proposal"
          scripts/publish-homebrew-formula.sh \
            SijanC147/homebrew-hextap \
            "$(cat "$proposal/base-sha")" \
            "$proposal/claude-rc-proxy.rb" \
            "$(cat "$proposal/formula-sha256")" \
            "$RELEASE_VERSION"
