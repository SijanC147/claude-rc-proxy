name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to process
        required: true
        type: string
      mode:
        description: Full release or Homebrew-only recovery
        required: true
        default: full
        type: choice
        options:
          - full
          - homebrew-only

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      stable: ${{ steps.metadata.outputs.stable }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      mode: ${{ steps.metadata.outputs.mode }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse release activity outside the canonical fork
        env:
          REPOSITORY: ${{ github.repository }}
        run: '[[ "$REPOSITORY" == "SijanC147/claude-rc-proxy" ]]'

      - name: Resolve and validate release metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            mode="$INPUT_MODE"
          else
            tag="$REF_NAME"
            mode="full"
          fi
          scripts/release-metadata.sh "$tag" "$mode" >> "$GITHUB_OUTPUT"

      - name: Verify tag exists on canonical main
        id: tag
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          git fetch origin refs/heads/main:refs/remotes/origin/main --tags
          sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Bind full-release provenance to the exact tag context
        if: steps.metadata.outputs.mode == 'full'
        env:
          RELEASE_COMMIT: ${{ steps.tag.outputs.sha }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]
          [[ "$GITHUB_SHA" == "$RELEASE_COMMIT" ]]

      - name: Validate Homebrew-only recovery target
        if: steps.metadata.outputs.mode == 'homebrew-only'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          STABLE: ${{ steps.metadata.outputs.stable }}
        run: |
          [[ "$STABLE" == "true" ]] || {
            echo "Homebrew-only recovery requires a stable tag" >&2
            exit 1
          }
          release_state="$(gh release view "$RELEASE_TAG" \
            --json isDraft,isImmutable,isPrerelease \
            --jq '[.isDraft, .isImmutable, .isPrerelease] | @tsv')"
          IFS=$'\t' read -r is_draft is_immutable is_prerelease <<< "$release_state"
          [[ "$is_draft" == "false" && "$is_immutable" == "true" && "$is_prerelease" == "false" ]]
          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.sha }}
          persist-credentials: false

      - name: Set up Go from tagged go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: go.mod

      - name: Run tagged-source quality gates
        run: |
          scripts/check-go-format.sh
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build -trimpath -o "$RUNNER_TEMP/claude-rc-proxy" .
          git diff --exit-code

  build:
    name: Build release archives
    needs: validate
    if: needs.validate.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: go.mod

      - name: Build and verify release assets
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          scripts/build-release.sh "$RELEASE_VERSION" "$RELEASE_COMMIT" dist
          scripts/verify-release-assets.sh dist "$RELEASE_VERSION" "$RELEASE_COMMIT"

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ needs.validate.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  native-verify:
    name: Run native binary (${{ matrix.target }})
    needs:
      - validate
      - build
    if: needs.validate.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Download verified workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ needs.validate.outputs.tag }}
          path: dist

      - name: Verify all assets and execute native target
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: scripts/verify-release-assets.sh dist "$RELEASE_VERSION" "$RELEASE_COMMIT"

  release:
    name: Publish GitHub release
    needs:
      - validate
      - build
      - native-verify
    if: needs.validate.outputs.mode == 'full'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Download verified workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ needs.validate.outputs.tag }}
          path: dist

      - name: Re-verify downloaded assets
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: scripts/verify-release-assets.sh dist "$RELEASE_VERSION" "$RELEASE_COMMIT"

      - name: Re-verify remote tag has not moved
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          remote_refs="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          remote_commit="$(awk '$2 ~ /\^\{\}$/ { print $1 }' <<< "$remote_refs")"
          if [[ -z "$remote_commit" ]]; then
            remote_commit="$(awk '$2 !~ /\^\{\}$/ { print $1 }' <<< "$remote_refs")"
          fi
          [[ "$remote_commit" == "$RELEASE_COMMIT" ]]

      - name: Attest release assets from the canonical workflow
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish draft only after complete asset verification
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: scripts/publish-release.sh "$GITHUB_REPOSITORY" "$RELEASE_TAG" dist "$PRERELEASE"

      - name: Require an immutable release attestation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          for attempt in {1..20}; do
            if gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            echo "immutable release attestation not ready ($attempt/20)" >&2
            sleep 3
          done
          echo "immutable release attestation did not become verifiable" >&2
          exit 1

  homebrew-dispatch:
    name: Dispatch and monitor private Homebrew publication
    needs:
      - validate
      - release
    if: >-
      ${{
        !cancelled() &&
        needs.validate.result == 'success' &&
        needs.validate.outputs.stable == 'true' &&
        (
          (needs.validate.outputs.mode == 'full' && needs.release.result == 'success') ||
          (needs.validate.outputs.mode == 'homebrew-only' && needs.release.result == 'skipped')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 220
    permissions:
      contents: read
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Load private tap dispatch credential from 1Password
        id: tap_secret
        uses: 1Password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
          version: 2.39.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          HOMEBREW_TAP_ACTIONS_TOKEN: op://CICD/HOMEBREW_TAP_ACTIONS_TOKEN/credential

      - name: Dispatch and wait for correlated private-tap run
        env:
          CORRELATION_ID: source-${{ github.run_id }}-${{ github.run_attempt }}
          GH_TOKEN: ${{ steps.tap_secret.outputs.HOMEBREW_TAP_ACTIONS_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.sha }}
        run: >-
          scripts/dispatch-homebrew-release.sh
          SijanC147/homebrew-hextap
          "$GITHUB_REPOSITORY"
          "$RELEASE_TAG"
          "$RELEASE_VERSION"
          "$SOURCE_COMMIT"
          "$CORRELATION_ID"
