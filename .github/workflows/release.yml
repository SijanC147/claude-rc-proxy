name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to process
        required: true
        type: string
      mode:
        description: Full release or Homebrew-only recovery
        required: true
        default: full
        type: choice
        options:
          - full
          - homebrew-only

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Managed Hextap release
    uses: SijanC147/hextap-toolkit/.github/workflows/release-go.yml@main
    permissions:
      attestations: write
      contents: write
      id-token: write
    with:
      manifest_path: .hextap.json
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}
    secrets:
      op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
